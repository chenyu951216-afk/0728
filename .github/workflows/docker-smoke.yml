name: Docker smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t eth-adaptive-ci .

      - name: Start exact production Docker CMD
        run: |
          docker run -d --name eth-adaptive-ci-run \
            -p 18080:8080 \
            -e PORT=8080 \
            -e DATABASE_PATH=/tmp/eth-adaptive-docker-ci.db \
            -e STRICT_REPLAY_BATCH_DECISIONS=2000 \
            -e SQLITE_BUSY_TIMEOUT_MS=20000 \
            -e STRICT_GAP_REPAIR_ROUNDS=2 \
            -e STRICT_MAX_QUARANTINED_GAPS=24 \
            eth-adaptive-ci

      - name: Wait for bootstrap liveness
        run: |
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/healthz >/tmp/health.json; then ok=1; break; fi
            if ! docker inspect -f '{{.State.Running}}' eth-adaptive-ci-run 2>/dev/null | grep -q true; then
              echo 'container exited before HTTP became ready'; docker logs eth-adaptive-ci-run || true; exit 1
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then echo 'bootstrap /healthz did not become ready within 40 seconds'; docker logs eth-adaptive-ci-run || true; exit 1; fi
          python - <<'PY'
          import json
          x=json.load(open('/tmp/health.json')); assert x['ok'] is True; assert x['alive'] is True; assert int(x['port']) == 8080
          PY

      - name: Wait for fully swapped production runtime
        run: |
          ready=0
          for i in $(seq 1 90); do
            code=$(curl -sS -o /tmp/auto.json -w '%{http_code}' http://127.0.0.1:18080/api/v30/autonomous || true)
            if [ "$code" = 200 ]; then ready=1; break; fi
            if ! docker inspect -f '{{.State.Running}}' eth-adaptive-ci-run 2>/dev/null | grep -q true; then
              echo 'container exited while loading production runtime'; docker logs eth-adaptive-ci-run || true; exit 1
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then echo 'production autonomous endpoint did not become ready within 90 seconds'; cat /tmp/auto.json || true; docker logs eth-adaptive-ci-run || true; exit 1; fi

      - name: Validate autonomous research runtime contract
        run: |
          curl -fsS http://127.0.0.1:18080/api/latest/pipeline >/tmp/pipeline.json
          curl -fsS http://127.0.0.1:18080/api/v31/autonomous-integrity >/tmp/integrity.json
          curl -fsS http://127.0.0.1:18080/api/v35/autonomous-features >/tmp/features.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/auto.json'))
          assert x['schema'] == 30, x
          assert int(x['research_start_ts']) == 1577808000, x
          assert int(x['research_end_exclusive_ts']) == 1785600000, x
          assert int(x['settlement_end_exclusive_ts']) == 1786723200, x
          assert x['no_strategy_templates'] is True, x
          assert x['no_manual_regime_templates'] is True, x
          assert x['legacy_success_label_used'] is False, x
          assert x['direct_trade_outcome_fitness'] is True, x
          assert x['walk_forward_causal'] is True, x
          assert x['future_path_after_plan_freeze_only'] is True, x
          assert float(x['paper_notional_usdt']) == 20000.0, x
          assert x['leverage_mode'] == 'MAX_AVAILABLE_AT_ORDER_TIME', x
          assert x['live_outcomes_isolated_from_historical_replay'] is True, x

          p=json.load(open('/tmp/pipeline.json'))
          names=[str(s.get('name') or '') for s in p.get('stages', [])]
          assert '6. AUTONOMOUS_DIRECT_R_STRATEGY_DISCOVERY' in names, p
          assert '7. COMPLETE_PACKAGE_CHRONOLOGICAL_OOS' in names, p
          assert '8. AUTONOMOUS_PACKAGE_CERTIFICATION' in names, p
          assert '9. CURRENT_LIVE_HANDOFF' in names, p
          assert p['joint_signal_then_execution_separation'] is False, p

          q=json.load(open('/tmp/integrity.json')); rules=q['rules']
          assert rules['storage_fail_closed'] is True, q
          assert rules['clean_baseline_required'] is True, q
          assert rules['fresh_closed_15m_required'] is True, q
          assert rules['ordered_public_trade_execution_monitor'] is True, q
          assert rules['partial_tp_live_parity'] is True, q
          assert rules['live_outcomes_separate_from_historical_replay'] is True, q

          f=json.load(open('/tmp/features.json'))
          assert f['schema'] == 35, f
          assert f['source'] == 'learning_feature_snapshots.features', f
          assert f['normalized_at_timestamp_refs_are_never_parsed_as_json'] is True, f
          PY

      - name: Validate HTTP routing and bind diagnostics
        run: |
          test "$(docker inspect -f '{{.State.Running}}' eth-adaptive-ci-run)" = "true"
          curl -fsS http://127.0.0.1:18080/ >/tmp/dashboard.html
          grep -q 'ETH Adaptive AI' /tmp/dashboard.html
          grep -q 'autonomous-v30-js' /tmp/dashboard.html
          grep -q 'autonomous-v32-compat' /tmp/dashboard.html
          grep -q 'Autonomous Strategy Discovery' /tmp/dashboard.html
          docker logs eth-adaptive-ci-run 2>&1 | grep -q 'UVICORN_BIND host=0.0.0.0 port=8080 mode=AUTONOMOUS_V35'
          docker logs eth-adaptive-ci-run 2>&1 | grep -q 'Uvicorn running on http://0.0.0.0:8080'

      - name: Show logs
        if: always()
        run: docker logs eth-adaptive-ci-run || true

      - name: Stop container
        if: always()
        run: docker rm -f eth-adaptive-ci-run || true
