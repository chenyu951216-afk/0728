name: Docker smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t eth-adaptive-ci .

      - name: Start exact production Docker CMD
        run: |
          docker run -d --name eth-adaptive-ci-run \
            -p 18080:8080 \
            -e PORT=8080 \
            -e DATABASE_PATH=/tmp/eth-adaptive-docker-ci.db \
            -e STRICT_REPLAY_BATCH_DECISIONS=2000 \
            -e SQLITE_BUSY_TIMEOUT_MS=20000 \
            -e STRICT_GAP_REPAIR_ROUNDS=2 \
            -e STRICT_MAX_QUARANTINED_GAPS=24 \
            eth-adaptive-ci

      - name: Wait for bootstrap liveness
        run: |
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/healthz >/tmp/health.json; then
              ok=1
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' eth-adaptive-ci-run 2>/dev/null | grep -q true; then
              echo 'container exited before HTTP became ready'
              docker logs eth-adaptive-ci-run || true
              exit 1
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo 'bootstrap /healthz did not become ready within 40 seconds'
            docker logs eth-adaptive-ci-run || true
            exit 1
          fi
          python - <<'PY'
          import json
          x=json.load(open('/tmp/health.json'))
          assert x['ok'] is True
          assert x['alive'] is True
          assert int(x['port']) == 8080
          PY

      - name: Wait for full production runtime
        run: |
          ready=0
          for i in $(seq 1 90); do
            code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:18080/readyz || true)
            if [ "$code" = 200 ]; then
              ready=1
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' eth-adaptive-ci-run 2>/dev/null | grep -q true; then
              echo 'container exited while loading production runtime'
              docker logs eth-adaptive-ci-run || true
              exit 1
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo 'production /readyz did not become ready within 90 seconds'
            cat /tmp/ready.json || true
            docker logs eth-adaptive-ci-run || true
            exit 1
          fi
          python - <<'PY'
          import json
          x=json.load(open('/tmp/ready.json'))
          assert x['ok'] is True and x['ready'] is True, x
          assert x['startup_status'] == 'PRODUCTION_READY', x
          PY

      - name: Validate joint research runtime contract
        run: |
          curl -fsS http://127.0.0.1:18080/api/v28/joint-research >/tmp/joint.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/joint.json'))
          assert x['joint_signal_entry_sl_tp'] is True, x
          assert int(x['research_start_ts']) == 1577836800, x
          assert int(x['research_decision_end_exclusive_ts']) == 1785600000, x
          assert int(x['label_support_cutoff_ts']) == 1785629700, x
          assert x['raw_download_reused'] is True, x
          assert x['no_lookahead']['features_closed_at_decision'] is True, x
          assert x['no_lookahead']['execution_plan_frozen_before_future_path'] is True, x
          PY

      - name: Validate HTTP routing and bind diagnostics
        run: |
          test "$(docker inspect -f '{{.State.Running}}' eth-adaptive-ci-run)" = "true"
          curl -fsS http://127.0.0.1:18080/ >/tmp/dashboard.html
          grep -q 'ETH Adaptive AI' /tmp/dashboard.html
          docker logs eth-adaptive-ci-run 2>&1 | grep -q 'UVICORN_BIND host=0.0.0.0 port=8080'
          docker logs eth-adaptive-ci-run 2>&1 | grep -q 'Uvicorn running on http://0.0.0.0:8080'

      - name: Show logs
        if: always()
        run: docker logs eth-adaptive-ci-run || true

      - name: Stop container
        if: always()
        run: docker rm -f eth-adaptive-ci-run || true
