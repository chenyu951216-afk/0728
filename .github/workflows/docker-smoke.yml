name: Docker smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t eth-adaptive-ci .

      - name: Start exact production CMD with unresolved Zeabur PORT interpolation
        run: |
          docker run -d --name eth-adaptive-ci-run \
            -p 18080:18080 \
            -e 'PORT=${WEB_PORT}' \
            -e WEB_PORT=18080 \
            -e DATABASE_PATH=/tmp/eth-adaptive-docker-ci.db \
            -e STRICT_REPLAY_BATCH_DECISIONS=2000 \
            -e SQLITE_BUSY_TIMEOUT_MS=20000 \
            -e STRICT_GAP_REPAIR_ROUNDS=2 \
            -e STRICT_MAX_QUARANTINED_GAPS=24 \
            eth-adaptive-ci

      - name: Wait for HTTP listener
        run: |
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18080/ >/tmp/dashboard.html; then
              ok=1
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' eth-adaptive-ci-run 2>/dev/null | grep -q true; then
              echo 'container exited before HTTP became ready'
              docker logs eth-adaptive-ci-run || true
              exit 1
            fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo 'HTTP did not become ready within 40 seconds'
            docker logs eth-adaptive-ci-run || true
            exit 1
          fi
          grep -q '9.0.1' /tmp/dashboard.html

      - name: Validate live production process and resolved port
        run: |
          test "$(docker inspect -f '{{.State.Running}}' eth-adaptive-ci-run)" = "true"
          curl -fsS http://127.0.0.1:18080/openapi.json >/tmp/openapi.json
          grep -q '9.0.1' /tmp/openapi.json
          docker logs eth-adaptive-ci-run 2>&1 | grep -q 'Uvicorn running on http://0.0.0.0:18080'

      - name: Show logs
        if: always()
        run: docker logs eth-adaptive-ci-run || true

      - name: Stop container
        if: always()
        run: docker rm -f eth-adaptive-ci-run || true
