name: Docker smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t eth-adaptive-ci .
      - name: Import production runtime inside image
        run: >-
          docker run --rm
          -e DATABASE_PATH=/tmp/eth-adaptive-docker-ci.db
          -e STRICT_REPLAY_BATCH_DECISIONS=2000
          -e SQLITE_BUSY_TIMEOUT_MS=20000
          -e STRICT_GAP_REPAIR_ROUNDS=2
          -e STRICT_MAX_QUARANTINED_GAPS=24
          eth-adaptive-ci
          python -c "import server, v14_operational_throughput, v15_data_resilience; assert server.app.version == '8.3.0'; assert server.core.state.get('runtime_version') == '8.3.0-20260810'; s=server.core.state.get('strict_replay',{}); assert s.get('data_resilience',{}).get('schema') == 1; assert s.get('data_resilience',{}).get('provider_retention_is_capability_not_replay_error') is True; assert s.get('learning_scheduler',{}).get('internal_price_gap_targeted_repair') is True; assert server.core.get_state('final_data_resilience_schema') == 1; print('docker-runtime-8.3.0-ok')"
