name: Docker smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t eth-adaptive-ci .
      - name: Import production runtime inside image
        run: >-
          docker run --rm
          -e DATABASE_PATH=/tmp/eth-adaptive-docker-ci.db
          -e STRICT_REPLAY_BATCH_DECISIONS=2000
          -e SQLITE_BUSY_TIMEOUT_MS=20000
          -e STRICT_GAP_REPAIR_ROUNDS=2
          -e STRICT_MAX_QUARANTINED_GAPS=24
          eth-adaptive-ci
          python -c "import server_v18, v18_operational_guard, v5_runtime, v7_runtime; s=server_v18.core.state.get('strict_replay',{}); f=s.get('final_authority',{}); checks={'app9':server_v18.app.version=='9.0.0','runtime9':server_v18.core.state.get('runtime_version')=='9.0.0-20260811','resilience':s.get('data_resilience',{}).get('schema')==1,'mature_frontier':s.get('runtime_integrity',{}).get('completion_is_latest_legally_labelable_decision') is True,'sqlite_truth':f.get('sqlite_is_authoritative_after_redeploy') is True,'no_future_features':f.get('future_price_features') is False,'dashboard_throttled':f.get('dashboard_poll_reexecutes_full_dataset_audit') is False,'source_preflight':f.get('cross_version_source_provenance_preflight') is True,'replay_binding':v5_runtime._replay_progress.__module__=='v16_runtime_integrity','scan_binding':v7_runtime.scan_v7.__module__=='v16_runtime_integrity','train_binding':v5_runtime.train_v5.__module__=='v18_operational_guard','manual_binding':server_v18.core.train_if_due.__module__=='v18_operational_guard','learning_binding':server_v18.core.learning_tick.__module__=='v18_final_system','signal_binding':server_v18.core.create_signal.__module__=='v18_final_system'}; print(checks); bad=[k for k,v in checks.items() if not v]; assert not bad, 'failed invariants: '+','.join(bad); print('docker-runtime-9.0-final-ok')"
