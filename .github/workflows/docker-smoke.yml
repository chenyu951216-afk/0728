name: Docker smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t eth-adaptive-ci .
      - name: Import production runtime inside image
        run: >-
          docker run --rm
          -e DATABASE_PATH=/tmp/eth-adaptive-docker-ci.db
          -e STRICT_REPLAY_BATCH_DECISIONS=2000
          -e SQLITE_BUSY_TIMEOUT_MS=20000
          eth-adaptive-ci
          python -c "import server, v14_operational_throughput; assert server.app.version == '8.2.3'; assert server.core.state.get('runtime_version') == '8.2.3-20260810'; assert server.core.state.get('strict_replay',{}).get('operational_throughput',{}).get('replay_batch_decisions') == 2000; print('docker-runtime-ok')"
