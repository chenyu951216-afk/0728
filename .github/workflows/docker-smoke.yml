name: Docker smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t eth-adaptive-ci .
      - name: Import production runtime inside image
        run: >-
          docker run --rm
          -e DATABASE_PATH=/tmp/eth-adaptive-docker-ci.db
          -e STRICT_REPLAY_BATCH_DECISIONS=2000
          -e SQLITE_BUSY_TIMEOUT_MS=20000
          -e STRICT_GAP_REPAIR_ROUNDS=2
          -e STRICT_MAX_QUARANTINED_GAPS=24
          eth-adaptive-ci
          python -c "import server_v18, v18_final_system, v18_operational_guard, v15_data_resilience, v16_runtime_integrity, v5_runtime, v7_runtime; assert server_v18.app.version == '9.0.0'; assert server_v18.core.state.get('runtime_version') == '9.0.0-20260811'; s=server_v18.core.state.get('strict_replay',{}); assert s.get('data_resilience',{}).get('schema') == 1; assert s.get('runtime_integrity',{}).get('completion_is_latest_legally_labelable_decision') is True; f=s.get('final_authority',{}); assert f.get('sqlite_is_authoritative_after_redeploy') is True; assert f.get('future_price_features') is False; assert f.get('dashboard_poll_reexecutes_full_dataset_audit') is False; assert f.get('cross_version_source_provenance_preflight') is True; assert v5_runtime._replay_progress.__module__ == 'v16_runtime_integrity'; assert v7_runtime.scan_v7.__module__ == 'v16_runtime_integrity'; assert v5_runtime.train_v5.__module__ == 'v18_operational_guard'; assert server_v18.core.train_if_due.__module__ == 'v18_operational_guard'; assert server_v18.core.learning_tick.__module__ == 'v18_final_system'; assert server_v18.core.create_signal.__module__ == 'v18_final_system'; assert server_v18.core.get_state('final_data_resilience_schema') == 1; print('docker-runtime-9.0-final-ok')"
