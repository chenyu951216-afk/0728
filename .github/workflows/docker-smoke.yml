name: Docker smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t eth-adaptive-ci .
      - name: Import production runtime inside image
        run: >-
          docker run --rm
          -e DATABASE_PATH=/tmp/eth-adaptive-docker-ci.db
          -e STRICT_REPLAY_BATCH_DECISIONS=2000
          -e SQLITE_BUSY_TIMEOUT_MS=20000
          -e STRICT_GAP_REPAIR_ROUNDS=2
          -e STRICT_MAX_QUARANTINED_GAPS=24
          eth-adaptive-ci
          python -c "import server, v14_operational_throughput, v15_data_resilience, v16_runtime_integrity, v5_runtime, v7_runtime; assert server.app.version == '8.4.0'; assert server.core.state.get('runtime_version') == '8.4.0-20260810'; s=server.core.state.get('strict_replay',{}); assert s.get('data_resilience',{}).get('schema') == 1; assert s.get('data_resilience',{}).get('provider_retention_is_capability_not_replay_error') is True; assert s.get('runtime_integrity',{}).get('completion_is_latest_legally_labelable_decision') is True; assert s.get('runtime_integrity',{}).get('single_composed_new_signal_entrance') is True; assert s.get('learning_scheduler',{}).get('replay_completion_uses_latest_legally_labelable_decision') is True; assert v5_runtime._replay_progress.__module__ == 'v16_runtime_integrity'; assert v7_runtime.scan_v7.__module__ == 'v16_runtime_integrity'; assert server.core.get_state('final_data_resilience_schema') == 1; print('docker-runtime-8.4.0-ok')"
