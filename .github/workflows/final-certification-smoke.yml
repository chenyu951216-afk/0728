name: Final certification smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  final-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production image
        run: docker build -t eth-adaptive-final .
      - name: Validate final runtime inside production image
        run: >-
          docker run --rm
          -e DATABASE_PATH=/tmp/eth-final-certification-ci.db
          -e STRICT_REPLAY_BATCH_DECISIONS=2000
          -e SQLITE_BUSY_TIMEOUT_MS=20000
          -e STRICT_GAP_REPAIR_ROUNDS=2
          -e STRICT_MAX_QUARANTINED_GAPS=24
          eth-adaptive-final
          python -c "import server_v19, v18_operational_guard as og, v5_runtime, v7_runtime, execution_v7, v20_historical_signal_evolution as evolution; core=server_v19.core; assert server_v19.app.version == '10.2.0'; assert core.state.get('runtime_version') == '10.2.0-20260813'; s=core.state.get('strict_replay',{}); f=s.get('final_authority',{}); assert f.get('sqlite_is_authoritative_after_redeploy') is True; assert f.get('single_runtime_state_loss_can_reset_derived_data') is False; assert f.get('confirmed_structural_corruption_rebuilds_derived_only') is True; assert f.get('raw_market_preserved') is True; assert f.get('raw_derivatives_preserved') is True; assert f.get('clean_dataset_id_preserved') is True; assert f.get('all_configured_strategy_directions_are_population_entrypoints') is True; assert f.get('regime_specialist_router') is True; assert f.get('execution_policy_evolution') is True; assert f.get('execution_untouched_audit_required') is True; assert f.get('future_price_features') is False; assert f.get('future_5m_path_is_label_only') is True; assert f.get('single_composed_live_signal_entrance') is True; assert f.get('dashboard_poll_reexecutes_full_dataset_audit') is False; assert f.get('potential_live_order_forces_fresh_audit') is True; assert f.get('cross_version_source_provenance_preflight') is True; assert f.get('missing_frozen_source_contract_can_be_silently_reused') is False; assert len(f.get('signal_genome_evolution') or []) >= 5; h=core.state.get('historical_signal_evolution',{}); assert h.get('schema') == 5; assert h.get('generations') == 7; assert h.get('population') == 36; assert h.get('minimum_new_untouched_decisions') == 320; assert h.get('minimum_oos_profit_factor') >= 1.25; assert h.get('fixed_strategy_direction_pairs_are_population_entrypoints') is True; assert h.get('same_failed_holdout_can_be_retried') is False; assert h.get('incumbent_compared_on_same_new_holdout') is True; assert h.get('no_lookahead') is True; c=core.state.get('coinglass_standard',{}); rules=c.get('rules',{}); assert rules.get('configured_plan') == 'STANDARD'; assert rules.get('range_limited_history_can_train') is False; assert rules.get('current_heatmap_can_rewrite_historical_features') is False; assert rules.get('current_heatmap_can_mutate_audited_stop') is False; assert rules.get('current_heatmap_can_veto_new_order') is False; assert core.Learner is evolution.HistoricalEvolutionLearner; assert v5_runtime.Learner is evolution.HistoricalEvolutionLearner; assert v5_runtime.train_v5.__module__ == 'v18_operational_guard'; assert v5_runtime.generate_learning_samples_v5.__module__ == 'v22_hierarchical_pipeline'; assert core.train_if_due.__module__ == 'v18_operational_guard'; assert core.create_signal.__module__ == 'v18_final_system'; assert core.learning_tick.__module__ == 'v22_hierarchical_pipeline'; assert v7_runtime.create_signal_v7.__module__ == 'v21_coinglass_standard'; assert execution_v7.policy_candidates.__module__ == 'v8_evolution'; assert execution_v7.MIN_AUDIT_PF >= 1.30; pub=core.state.get('public_runtime',{}); assert pub.get('single_public_version') is True; assert pub.get('runtime_version') == '10.2.0-20260813'; paths={getattr(r,'path',None) for r in core.app.router.routes}; assert {'/api/latest/pipeline','/api/latest/champions','/api/latest/execution','/api/latest/final-status'}.issubset(paths); p=core.state.get('hierarchical_pipeline',{}); assert p.get('feature_schema') == 9; assert p.get('price_collection_gate',{}).get('status') == 'COLLECTING_FULL_HISTORY_BEFORE_REPLAY'; assert p.get('stages')[4].get('percent') == 0.0; assert p.get('no_lookahead_contract',{}).get('higher_timeframe_close_required') is True; assert p.get('no_lookahead_contract',{}).get('raw_history_may_be_precollected_but_is_not_visible_to_historical_decisions') is True; assert len(p.get('stages') or []) == 8; view=og.authoritative_view(core,True); assert view['safety_contract']['future_price_features'] is False; assert view['safety_contract']['execution_untouched_audit_required'] is True; assert view['samples']['rows_per_decision'] == 14; print('final-runtime-10.2-authority-ok')"
      - name: Render production dashboard
        run: >-
          docker run --rm
          -e DATABASE_PATH=/tmp/eth-final-dashboard-ci.db
          eth-adaptive-final
          python -c "import server_v19; print(server_v19.dashboard())" > /tmp/dashboard.html
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          import re
          html=open('/tmp/dashboard.html',encoding='utf-8').read()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          assert scripts, 'rendered dashboard contains no inline scripts'
          open('/tmp/dashboard.js','w',encoding='utf-8').write('\n;\n'.join(scripts))
          assert 'v19-startup-script' in html
          assert 'Hierarchical Point-in-Time Learning / Final Authority' in html
          assert 'startup_preflight' in html
          assert 'ETH Adaptive AI 10.2' in html
          assert 'Legacy v5 schema' not in html
          assert '/api/latest/champions' in html
          assert '/api/latest/execution' in html
          print('scripts',len(scripts),'bytes',sum(map(len,scripts)))
          PY
      - name: Validate rendered dashboard JavaScript syntax
        run: node --check /tmp/dashboard.js
