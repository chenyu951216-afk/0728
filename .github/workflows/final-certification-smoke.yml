name: Final certification smoke

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  final-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build production image
        run: docker build -t eth-adaptive-final .
      - name: Validate final runtime inside production image
        run: >-
          docker run --rm
          -e DATABASE_PATH=/tmp/eth-final-certification-ci.db
          -e STRICT_REPLAY_BATCH_DECISIONS=2000
          -e SQLITE_BUSY_TIMEOUT_MS=20000
          -e STRICT_GAP_REPAIR_ROUNDS=2
          -e STRICT_MAX_QUARANTINED_GAPS=24
          eth-adaptive-final
          python -c "import server_v18, v18_final_system as v18, v18_operational_guard as og, v5_runtime, v8_evolution, execution_v7; assert server_v18.app.version == '9.0.0'; assert server_v18.core.state.get('runtime_version') == '9.0.0-20260811'; s=server_v18.core.state.get('strict_replay',{}); f=s.get('final_authority',{}); assert f.get('sqlite_is_authoritative_after_redeploy') is True; assert f.get('single_runtime_state_loss_can_reset_derived_data') is False; assert f.get('confirmed_structural_corruption_rebuilds_derived_only') is True; assert f.get('raw_market_preserved') is True; assert f.get('raw_derivatives_preserved') is True; assert f.get('clean_dataset_id_preserved') is True; assert f.get('all_7_strategies_x_2_directions_explicitly_certified') is True; assert f.get('regime_specialist_router') is True; assert f.get('execution_policy_evolution') is True; assert f.get('execution_untouched_audit_required') is True; assert f.get('future_price_features') is False; assert f.get('future_5m_path_is_label_only') is True; assert f.get('single_composed_live_signal_entrance') is True; assert f.get('dashboard_poll_reexecutes_full_dataset_audit') is False; assert f.get('potential_live_order_forces_fresh_audit') is True; assert f.get('cross_version_source_provenance_preflight') is True; assert f.get('missing_frozen_source_contract_can_be_silently_reused') is False; assert len(f.get('signal_genome_evolution') or []) >= 5; assert v5_runtime.train_v5.__module__ == 'v18_operational_guard'; assert server_v18.core.train_if_due.__module__ == 'v18_operational_guard'; assert server_v18.core.create_signal.__module__ == 'v18_final_system'; assert server_v18.core.learning_tick.__module__ == 'v18_final_system'; assert execution_v7.policy_candidates.__module__ == 'v8_evolution'; view=og.authoritative_view(server_v18.core,True); assert view['safety_contract']['future_price_features'] is False; assert view['safety_contract']['execution_untouched_audit_required'] is True; assert view['samples']['rows_per_decision'] == 14; print('final-runtime-9.0-authority-ok')"
      - name: Render production dashboard
        run: >-
          docker run --rm
          -e DATABASE_PATH=/tmp/eth-final-dashboard-ci.db
          eth-adaptive-final
          python -c "import server_v18; print(server_v18.dashboard())" > /tmp/dashboard.html
      - name: Extract inline JavaScript
        run: |
          python - <<'PY'
          import re
          html=open('/tmp/dashboard.html',encoding='utf-8').read()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S|re.I)
          assert scripts, 'rendered dashboard contains no inline scripts'
          open('/tmp/dashboard.js','w',encoding='utf-8').write('\n;\n'.join(scripts))
          assert 'v18-final-authority-script' in html
          assert 'Final Authority / 最終學習與交易鏈' in html
          assert 'Source Provenance' in html
          assert 'ETH Adaptive AI 9.0 Final Authority' in html
          print('scripts',len(scripts),'bytes',sum(map(len,scripts)))
          PY
      - name: Validate rendered dashboard JavaScript syntax
        run: node --check /tmp/dashboard.js
