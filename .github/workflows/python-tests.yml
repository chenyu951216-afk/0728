name: Python tests

on:
  push:
    branches: ["main", "agent/adaptive-eth-learning-engine"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile app.py server.py adaptive_engine.py adaptive_v5.py execution_v6.py execution_v7.py market_data.py derivative_data.py v5_runtime.py v5_async_runtime.py v6_runtime.py v6_scan_runtime.py v7_runtime.py v7_timesafe_learning.py v7_signal_learner.py v7_execution_alignment.py v7_fine_execution.py v7_reentry_guard.py v7_discord_runtime.py v7_post_exit.py v7_live_health.py v7_learning_guard.py v7_trade_monitor.py v7_timeout_guard.py v7_trade_feed.py v7_monitor_gate.py v8_migration.py v8_evolution.py v8_execution_oof.py v8_execution_walkforward.py v8_notice.py v8_storage_guard.py v8_stability.py v9_final.py v9_readiness.py v9_training_store.py v9_live_parity.py v9_derivative_gate.py v9_multisource_derivatives.py v9_multisource_integrity.py v10_final_integrity.py v10_source_freeze.py v10_overfit_guard.py v10_notice.py v11_sqlite_stability.py v12_clean_baseline.py v13_replay_cursor_integrity.py test_app.py test_execution_v6.py test_v7.py test_v7_timesafe.py test_v7_fine_execution.py test_v7_trade_monitor.py test_v7_timeout.py test_v7_safety.py test_v7_legacy_runtime.py test_v8_evolution.py test_v8_stability.py test_v9_final.py test_v9_readiness.py test_v9_training_store.py test_v9_live_parity.py test_v9_derivative_gate.py test_v9_multisource_derivatives.py test_v9_multisource_integrity.py test_v9_learning_scheduler.py test_v10_final_integrity.py test_v10_overfit_guard.py test_v11_sqlite_stability.py test_v12_clean_baseline.py test_v13_replay_cursor_integrity.py
      - name: Dashboard present
        run: test -s dashboard_v721.html && grep -q '系統子服務健康' dashboard_v721.html && grep -q 'Execution Champion' dashboard_v721.html
      - name: Unit tests
        run: python -m unittest -v
      - name: Runtime import smoke test
        env:
          DATABASE_PATH: /tmp/eth-final-clean-baseline-ci.db
        run: python -c "import os; p=os.environ['DATABASE_PATH']; [os.remove(x) for x in (p,p+'-wal',p+'-shm') if os.path.exists(x)]; import server, execution_v7, v5_runtime, adaptive_v5, v7_runtime, v8_evolution, v9_final, v9_readiness, v10_notice, v10_final_integrity, v11_sqlite_stability, v12_clean_baseline, v13_replay_cursor_integrity; assert server.app.version == '8.2.2'; assert server.core.state.get('runtime_version') == '8.2.2-20260810'; assert server.core.state.get('risk_monitor_mode') == 'GATE_PUBLIC_TRADES_ORDERED'; assert server.core.state.get('stability_mode') == 'SUBSYSTEM_ISOLATED_FAIL_CLOSED'; s=server.core.state.get('strict_replay',{}); assert s.get('htf_close_time_required') is True; assert s.get('audit_can_mutate_policy') is False; assert s.get('training_store',{}).get('full_span_sampling') is True; assert s.get('live_parity',{}).get('canonical_derivative_features') is True; assert s.get('learning_scheduler',{}).get('core_sources_frozen_before_replay') is True; assert s.get('learning_scheduler',{}).get('unresolved_price_gap_cannot_advance_replay_cursor') is True; assert s.get('learning_scheduler',{}).get('feature_builder_contract_verified') is True; assert s.get('final_integrity',{}).get('sample_schema') == 6; assert s.get('final_integrity',{}).get('signal_outcome_path') == '5m sequential bars after frozen 15m decision'; assert s.get('source_freeze',{}).get('mid_generation_provider_join_forbidden') is True; assert s.get('overfit_guard',{}).get('overlapping_future_label_windows_cannot_count_as_independent_evidence') is True; assert s.get('overfit_guard',{}).get('clustered_ev_bootstrap_ci05_must_be_positive') is True; assert s.get('cursor_integrity',{}).get('unresolved_price_gap_can_advance_cursor') is False; assert s.get('cursor_integrity',{}).get('feature_builder_contract_verified') is True; dbs=s.get('sqlite_stability',{}); assert dbs.get('runtime_connections_do_not_repeat_wal_or_ddl') is True; assert dbs.get('sample_commit_every') == 14; prov=s.get('dataset_provenance',{}); assert prov.get('clean') is True; assert prov.get('champion_certification_requires_clean_baseline') is True; assert server.core.state.get('dataset_baseline',{}).get('status') == 'CLEAN'; assert server.core.state.get('dataset_baseline',{}).get('dataset_id'); assert v7_runtime.maybe_boot_notice.__module__ == 'v10_notice'; assert v8_evolution.GenomeEvolutionLearner.train_strategy_direction.__module__ == 'v10_overfit_guard'; assert adaptive_v5._stats.__module__ == 'v10_overfit_guard'; assert getattr(adaptive_v5.ModelStore.add_sample,'_v11_short_txn',False) is True; assert execution_v7._signal_oof_opportunities.__module__ == 'v8_execution_oof'; assert execution_v7.optimize_all.__module__ == 'v12_clean_baseline'; assert execution_v7.simulate_policy.__module__ == 'v9_final'; assert v5_runtime.generate_learning_samples_v5.__module__ == 'v10_final_integrity'; assert v5_runtime.train_v5.__module__ == 'v13_replay_cursor_integrity'; assert v10_final_integrity.generate_samples.__module__ == 'v13_replay_cursor_integrity'; assert v9_readiness._coinglass_ready_through.__module__ == 'v10_source_freeze'; assert v9_final._strict_derivative_extras.__module__ == 'v10_source_freeze'; assert adaptive_v5.ModelStore.samples.__module__ == 'v9_training_store'; assert server.core.create_signal.__module__ == 'v12_clean_baseline'; assert server.core._best_source.__module__ == 'v10_final_integrity'; assert server.core.scan_worker.__module__ == 'v11_sqlite_stability'; con=server.core.db(); assert con.execute('PRAGMA busy_timeout').fetchone()[0] == 5000; con.close(); assert server.core.get_state('point_in_time_sample_schema') == 6; assert server.core.get_state('replay_cursor_integrity_schema') == 2; import v5_async_runtime as lar; assert not lar._legacy_runtime_allowed(server.core); print(server.app.version, server.core.state.get('runtime_version'), 'clean_dataset', 'cursor_integrity_v2', 'feature_builder_contract', 'schema6', 'sqlite_guard', '5m_event_labels', 'horizon_clustered_oos', 'strict_replay', 'audit_no_mutation', 'legacy_v6_disabled')"
