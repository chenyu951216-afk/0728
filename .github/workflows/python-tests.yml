name: Python tests

on:
  push:
    branches: ["main", "agent/adaptive-eth-learning-engine"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile app.py server.py adaptive_engine.py adaptive_v5.py execution_v6.py execution_v7.py market_data.py derivative_data.py v5_runtime.py v5_async_runtime.py v6_runtime.py v6_scan_runtime.py v7_runtime.py v7_timesafe_learning.py v7_signal_learner.py v7_execution_alignment.py v7_fine_execution.py v7_reentry_guard.py v7_discord_runtime.py v7_post_exit.py v7_live_health.py v7_learning_guard.py v7_trade_monitor.py v7_timeout_guard.py v7_trade_feed.py v7_monitor_gate.py v8_migration.py v8_evolution.py v8_execution_oof.py v8_notice.py test_app.py test_execution_v6.py test_v7.py test_v7_timesafe.py test_v7_fine_execution.py test_v7_trade_monitor.py test_v7_timeout.py test_v7_safety.py test_v7_legacy_runtime.py test_v8_evolution.py
      - name: Dashboard present
        run: test -s dashboard_v7.html && grep -q 'ETH Adaptive AI v7' dashboard_v7.html
      - name: Unit tests
        run: python -m unittest -v
      - name: Runtime import smoke test
        env:
          DATABASE_PATH: /tmp/eth-evolution-ci.db
        run: python -c "import server, execution_v7; assert server.app.version == '7.1.0'; assert server.core.state.get('risk_monitor_mode') == 'GATE_PUBLIC_TRADES_ORDERED'; assert 'risk_feed_probe' in server.core.state; assert execution_v7._signal_oof_opportunities.__module__ == 'v8_execution_oof'; con=server.core.db(); assert con.execute(\"SELECT 1 FROM sqlite_master WHERE type='table' AND name='evolution_trade_ledger'\").fetchone(); con.close(); assert server.core.get_state('evolution_migration_schema') == 1; import v5_async_runtime as lar; assert not lar._legacy_runtime_allowed(server.core); print(server.app.version, server.core.state.get('runtime_version'), 'evolution_guarded', 'legacy_v6_disabled')"
