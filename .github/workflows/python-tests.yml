name: Python tests

on:
  push:
    branches: ["main", "agent/adaptive-eth-learning-engine"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile app.py server.py adaptive_engine.py adaptive_v5.py execution_v6.py execution_v7.py market_data.py derivative_data.py v5_runtime.py v5_async_runtime.py v6_runtime.py v6_scan_runtime.py v7_runtime.py v7_timesafe_learning.py v7_signal_learner.py v7_execution_alignment.py v7_learning_guard.py v7_trade_monitor.py test_app.py test_execution_v6.py test_v7.py test_v7_timesafe.py test_v7_trade_monitor.py
      - name: Dashboard present
        run: test -s dashboard.html
      - name: Unit tests
        run: python -m unittest -v
