name: Python tests

on:
  push:
    branches: ["main", "agent/adaptive-eth-learning-engine"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile app.py server.py adaptive_engine.py adaptive_v5.py execution_v6.py execution_v7.py market_data.py derivative_data.py v5_runtime.py v5_async_runtime.py v6_runtime.py v6_scan_runtime.py v7_runtime.py v7_timesafe_learning.py v7_signal_learner.py v7_execution_alignment.py v7_fine_execution.py v7_reentry_guard.py v7_discord_runtime.py v7_post_exit.py v7_live_health.py v7_learning_guard.py v7_trade_monitor.py v7_timeout_guard.py v7_trade_feed.py v7_monitor_gate.py v8_migration.py v8_evolution.py v8_execution_oof.py v8_execution_walkforward.py v8_notice.py v8_storage_guard.py v8_stability.py v9_final.py test_app.py test_execution_v6.py test_v7.py test_v7_timesafe.py test_v7_fine_execution.py test_v7_trade_monitor.py test_v7_timeout.py test_v7_safety.py test_v7_legacy_runtime.py test_v8_evolution.py test_v8_stability.py test_v9_final.py
      - name: Dashboard present
        run: test -s dashboard_v721.html && grep -q '系統子服務健康' dashboard_v721.html && grep -q 'Execution Champion' dashboard_v721.html
      - name: Unit tests
        run: python -m unittest -v
      - name: Runtime import smoke test
        env:
          DATABASE_PATH: /tmp/eth-strict-final-ci.db
        run: python -c "import server, execution_v7, v5_runtime; assert server.app.version == '8.0.0'; assert server.core.state.get('runtime_version') == '8.0.0-20260809'; assert server.core.state.get('risk_monitor_mode') == 'GATE_PUBLIC_TRADES_ORDERED'; assert server.core.state.get('stability_mode') == 'SUBSYSTEM_ISOLATED_FAIL_CLOSED'; assert server.core.state.get('strict_replay',{}).get('htf_close_time_required') is True; assert server.core.state.get('strict_replay',{}).get('audit_can_mutate_policy') is False; assert execution_v7._signal_oof_opportunities.__module__ == 'v8_execution_oof'; assert execution_v7.optimize_all.__module__ == 'v8_stability'; assert execution_v7.simulate_policy.__module__ == 'v9_final'; assert v5_runtime.generate_learning_samples_v5.__module__ == 'v9_final'; con=server.core.db(); assert con.execute(\"SELECT 1 FROM sqlite_master WHERE type='table' AND name='evolution_trade_ledger'\").fetchone(); con.close(); assert server.core.get_state('evolution_migration_schema') == 1; assert server.core.get_state('execution_walkforward_schema') == 1; assert server.core.get_state('point_in_time_sample_schema') == 5; import v5_async_runtime as lar; assert not lar._legacy_runtime_allowed(server.core); print(server.app.version, server.core.state.get('runtime_version'), 'strict_replay', 'audit_no_mutation', 'legacy_v6_disabled')"
